name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Public source boundary
        run: |
          python3 scripts/test-public-snapshot.py
          python3 scripts/verify-public-snapshot.py

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Web audio and localization regression
        run: |
          node scripts/verify-listener-player.mjs
          node scripts/verify-listener-i18n.mjs
          node scripts/verify-speaker-mic.mjs
          node scripts/verify-public-branding.mjs

      - name: Unit test, lint, and assemble
        run: >-
          ./gradlew testDebugUnitTest
          :core:stream:test :core:translation:test
          :provider:gemma-translation:assembleDebug
          :app:lintAlpha :app:assembleAlpha :app:assembleRelease --stacktrace

      # Public CI checks source-only builds without the separately obtained glossary.
      # Full local APK validation must run :app:verifyPackagedThirdPartyLicenseAssets
      # with the reviewed glossary present before any APK handoff.

      # APKs and logs are not uploaded automatically. A separate reviewed release
      # procedure must approve the exact artifact hash and destination.
