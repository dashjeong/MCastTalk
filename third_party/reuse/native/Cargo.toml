[package]
name = "mcasttalk-reuse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "mcasttalk_reuse"
crate-type = ["cdylib", "rlib"]

[dependencies]
reuse-rs = { git = "https://github.com/altunenes/re-use-rs", rev = "88638f3e137848a50d6aca6906530ed2b2b72acc" }
jni = "=0.21.1"
rayon = "=1.12.0"
hound = "=3.5.1"
serde_json = "1.0"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
